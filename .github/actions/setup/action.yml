name: Setup
description: Install pnpm, Node and the dependencies of packages/schemas and apps/api-core

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      with:
        version: 12.11.2

    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: |
          packages/schemas/pnpm-lock.yaml
          apps/api-core/pnpm-lock.yaml

    - name: Install schemas
      shell: bash
      working-directory: packages/schemas
      run: pnpm install --frozen-lockfile

    - name: Install api-core
      shell: bash
      working-directory: apps/api-core
      run: pnpm install --frozen-lockfile
