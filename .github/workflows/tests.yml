name: Tests

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            packages/schemas/pnpm-lock.yaml
            apps/api-core/pnpm-lock.yaml

      - name: Install schemas
        working-directory: packages/schemas
        run: pnpm install --frozen-lockfile

      - name: Install api-core
        working-directory: apps/api-core
        run: pnpm install --frozen-lockfile

      - name: Test schemas
        run: pnpm test:schemas

      - name: Test api-core
        run: pnpm test:api
