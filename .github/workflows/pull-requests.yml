name: Pull requests

on:
  pull_request:
    branches: [development, main]
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: pull-requests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-core-lint:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup
        with:
          app: api-core

      - name: Lint api-core
        run: pnpm lint:api

  api-core-typecheck:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup
        with:
          app: api-core

      - name: Typecheck api-core
        run: pnpm typecheck:api

  api-core-format:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup
        with:
          app: api-core

      - name: Check api-core formatting
        run: pnpm format:check:api

  tests:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup
        with:
          app: api-core

      - name: Test schemas
        run: pnpm test:schemas

      - name: Test api-core
        run: pnpm test:api

  web-lint:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup
        with:
          app: web

      - name: Lint web
        run: pnpm lint:web

  web-typecheck:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup
        with:
          app: web

      - name: Typecheck web
        run: pnpm typecheck:web
